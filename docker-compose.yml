services:
  tududi:
    image: bk-dashboard:custom
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bk-dashboard
    environment:
      - TUDUDI_USER_EMAIL=${TUDUDI_USER_EMAIL}
      - TUDUDI_USER_PASSWORD=${TUDUDI_USER_PASSWORD}
      - TUDUDI_SESSION_SECRET=${TUDUDI_SESSION_SECRET}
      - TUDUDI_ALLOWED_ORIGINS=${TUDUDI_ALLOWED_ORIGINS:-http://localhost:3007}
      - TUDUDI_TRUST_PROXY=${TUDUDI_TRUST_PROXY:-false}
      - TUDUDI_UPLOAD_PATH=/app/backend/uploads
      - TUDUDI_LANG=${TUDUDI_LANG:-ja}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - BK_TELEGRAM_CHAT_ID=${BK_TELEGRAM_CHAT_ID:-}
      - METABASE_URL=${METABASE_URL:-}
      - METABASE_USERNAME=${METABASE_USERNAME:-}
      - METABASE_PASSWORD=${METABASE_PASSWORD:-}
      - CASINO_KPI_SYNC_ENABLED=${CASINO_KPI_SYNC_ENABLED:-true}
      - CASINO_KPI_SYNC_CRON=${CASINO_KPI_SYNC_CRON:-*/5 * * * *}
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
    volumes:
      - ./tududi_db:/app/backend/db
      - ./uploads:/app/backend/uploads
    ports:
      - "${TUDUDI_HOST_PORT:-3007}:3002"
    restart: unless-stopped
